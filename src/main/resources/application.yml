spring:
  application:
    name: pharmasense-backend
  threads:
    virtual:
      enabled: true # JDBC calls and OTP/email calls ride virtual threads so one request never pins a platform thread

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pharmasense}
    username: ${DB_USERNAME:pharmasense}
    password: ${DB_PASSWORD:pharmasense}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Flyway owns the schema; Hibernate only ever validates it matches
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 25

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      connect-timeout: 3s
      timeout: 3s

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
            scope: openid, profile, email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v1/api-docs
  swagger-ui:
    path: /v1/swagger-ui.html

logging:
  level:
    root: INFO
    com.pharmasense: ${APP_LOG_LEVEL:INFO}

# --- Application-specific configuration -------------------------------------------------
pharmasense:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:3000}

  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-before-any-real-deployment-32bytes-min}
    issuer: ${JWT_ISSUER:pharmasense}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}

  otp:
    length: 6
    ttl-minutes: 10
    max-verify-attempts: 5
    resend-cooldown-seconds: 45

  zeptomail:
    api-url: ${ZEPTOMAIL_API_URL:https://api.zeptomail.com/v1.1/email}
    api-token: ${ZEPTOMAIL_API_TOKEN:}
    from-email: ${ZEPTOMAIL_FROM_EMAIL:noreply@pharmasense.app}
    from-name: ${ZEPTOMAIL_FROM_NAME:Pharmasense}
    send-enabled: ${ZEPTOMAIL_SEND_ENABLED:true} # false in local/test => emails are logged instead of sent

  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}

  agent:
    provider: groq
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:llama-3.3-70b-versatile}
    max-output-tokens: 1024
    max-tool-iterations: 6

  sync:
    tenant-snapshot-cache-ttl-hours: 6
    max-push-batch-size: 500

  admin:
    impersonation-ttl-minutes: 30
    # If set and no super-admin exists yet with this email, one is created automatically on startup
    # (status ACTIVE, sign in with the normal email + OTP flow - no password to set up).
    bootstrap-email: ${SUPER_ADMIN_BOOTSTRAP_EMAIL:}
    bootstrap-full-name: ${SUPER_ADMIN_BOOTSTRAP_NAME:Platform Admin}
